name: BlackDuck Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  blackduck-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

